; ACFly F9 (K9 Mini) Hardware Configuration
; Version: F9_2025V1
; Based on: git_F9_2026 (ACFly K9 Mini hardware)

[hardware]
main_version = 6    ; F9
sub_version  = 0    ;

; ===========================================================================
; LED / 蜂鸣器配置
; ===========================================================================
[led]
timer = TIM2
buzzer_pin = PA0
buzzer_af = 1
buzzer_channel = 1
blue_pin = PA1
blue_af = 1
blue_channel = 2
blue_inverted = true
green_pin = PA2
green_af = 1
green_channel = 3
green_inverted = true
red_pin = PA3
red_af = 1
red_channel = 4
red_inverted = true

; ===========================================================================
; IMU 传感器配置
;   BMI088:   SPI1, ACCEL CS=PC4, GYRO CS=PC5
;             axis_index={1,-2,-3} → x,-y,-z
;   ICM20689: SPI4, CS=PE11
;             axis_index={2,-1,3} → y,-x,z
;   SPL06:    SPI1, CS=PA4
; ===========================================================================
[imu_bmi088]
spi = spi1
accel_cs_pin = PC4
gyro_cs_pin = PC5
axis = x, -y, -z
prio = 10

[imu_icm20689]
spi = spi4
cs_pin = PE11
axis = y, -x, z
prio = 7

[imuBaro_spl06]
spi = spi1
cs_pin = PA4
prio = 10

; ===========================================================================
; 模拟 OSD 配置 (AT7456E)
;   OSD_CS: PE11, SPI4
; ===========================================================================
[osd_analog]
spi = spi4
cs_pin = PE11

; ===========================================================================
; SBUS 接收机配置
;   USART2 RX = PD6, AF7, 开漏上拉
; ===========================================================================
[sbus]
uart = uart2
rx_pin = PD6
rx_af = 7
rx_pull = pull_up
rx_otype = open_drain

; ===========================================================================
; UART 配置
; ===========================================================================
[uart1]
tx_pin = PA9
tx_af = 7
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA1_Stream3
rx_pin = PA10
rx_af = 7
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

[uart3]
tx_pin = PD8
tx_af = 7
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA2_Stream0
rx_pin = PD9
rx_af = 7
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

[uart5]
tx_pin = PB13
tx_af = 14
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA2_Stream1
rx_pin = PB12
rx_af = 14
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

[uart7]
tx_pin = PE8
tx_af = 7
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA2_Stream2
rx_pin = PE7
rx_af = 7
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

[uart8]
tx_pin = PE1
tx_af = 8
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA2_Stream3
rx_pin = PE0
rx_af = 8
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

; ===========================================================================
; CAN 配置
; ===========================================================================
[can1]
tx_pin = PD1
tx_af = 9
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
rx_pin = PD0
rx_af = 9
rx_pull = none
rx_otype = push_pull
rx_speed = very_high

; ===========================================================================
; I2C 配置
;   I2C1 (外部): PB8 SCL AF4, PB9 SDA AF4
;                TX_DMA=DMA1_Stream6, RX_DMA=DMA1_Stream7
;   I2C2 (内部): PB10 SCL AF4, PB11 SDA AF4
;                TX_DMA=DMA1_Stream2, RX_DMA=DMA1_Stream4
; ===========================================================================
[i2c1]
enabled = true
scl_pin = PB8
scl_af = 4
scl_pull = pull_up
scl_otype = open_drain
scl_speed = high
sda_pin = PB9
sda_af = 4
sda_pull = pull_up
sda_otype = open_drain
sda_speed = high
tx_dma = DMA1_Stream6
rx_dma = DMA1_Stream7

[i2c2]
enabled = true
scl_pin = PB10
scl_af = 4
scl_pull = pull_up
scl_otype = open_drain
scl_speed = high
sda_pin = PB11
sda_af = 4
sda_pull = pull_up
sda_otype = open_drain
sda_speed = high
tx_dma = DMA1_Stream2
rx_dma = DMA1_Stream4

[i2cInt]    ;内部I2C（连接内部罗盘）
i2c = i2c2

; ===========================================================================
; 内部罗盘轴向配置
;   依据 git_F9_2026 drv_compass_InternalMag_I.cpp 中 axis_index 解码：
;   axis_index = {a, b, c} → out_x=sensor[abs(a)-1]*sign(a), 以此类推
; ===========================================================================
[i2c_compass_internal]
QMC5883P = -x, y, -z
QMC5883 = y, x, -z
IST8310 = -y, -x, z
FXOS8700 = -y, x, z
QMC6983 = y, x, -z


; ===========================================================================
; 外部罗盘轴向配置
;   依据 git_F9_2026 drv_compass_ExtMag_I.cpp 中 axis_index 解码
; ===========================================================================
[i2c_compass_external]
QMC5883P = x, -y, -z
HMC5983 = -z, -x, -y
HMC5883 = -z, -x, -y
QMC5883 = -y, -x, -z
Mag3110 = -y, -x, z
IST8310 = -x, -y, -z

; ===========================================================================
; SPI 配置
;   SPI1: PA5(SCK AF5) / PA6(MISO AF5) / PA7(MOSI AF5)
;         TX_DMA=DMA1_Stream0, RX_DMA=DMA1_Stream1
;   SPI4: PE12(SCK AF5) / PE13(MISO AF5) / PE14(MOSI AF5)
;         TX_DMA=DMA2_Stream6, RX_DMA=DMA2_Stream7
; ===========================================================================
[spi1]
sck_pin = PA5
sck_af = 5
miso_pin = PA6
miso_af = 5
mosi_pin = PA7
mosi_af = 5
tx_dma = DMA1_Stream0
rx_dma = DMA1_Stream1

[spi4]
sck_pin = PE12
sck_af = 5
miso_pin = PE13
miso_af = 5
mosi_pin = PE14
mosi_af = 5
tx_dma = DMA2_Stream6
rx_dma = DMA2_Stream7

; ===========================================================================
; ADC 配置
;   ADC 序列: [0]=VREFINT(INP19), [1]=PC0(INP10)=电流, [2]=PC1(INP11)=电压
;   adcGet_MainBaterry1_Current → ADC3ConvertedData[1] → PC0(ch10)
;   adcGet_MainBaterry1_Voltage → ADC3ConvertedData[2] → PC1(ch11)
; ===========================================================================
[adc]
resolution = 16
oversampling = 1024
bat1_volt = adc3_ch11
bat1_volt_pin = PC1
bat1_volt_sample_time = 7
bat1_current = adc3_ch10
bat1_current_pin = PC0
bat1_current_sample_time = 7

; ===========================================================================
; PWM 通道配置 (共 12 路)
;   对应 git_F9_2026 drv_PWMOut.cpp 中通道顺序（已修正实际 GPIO AF 配置）
;   pwm1~2  : TIM15 (APB2) CH2/CH1 → PE6/PE5 AF4
;   pwm3~4  : TIM3  (APB1) CH1/CH2 → PB4/PB5 AF2
;   pwm5~6  : TIM8  (APB2) CH2/CH1 → PC7/PC6 AF3
;   pwm7~8  : TIM4  (APB1) CH4/CH3 → PD15/PD14 AF2
;   pwm9~10 : TIM12 (APB1) CH2/CH1 → PB15/PB14 AF2
;   pwm11~12: TIM3  (APB1) CH3/CH4 → PB0/PB1 AF2
; ===========================================================================
[pwm1]
type = pwm
timer = TIM15_CH2
pin = PE6
af = 4
pull = none
otype = push_pull
speed = very_high

[pwm2]
type = pwm
timer = TIM15_CH1
pin = PE5
af = 4
pull = none
otype = push_pull
speed = very_high

[pwm3]
type = pwm
timer = TIM3_CH1
pin = PB4
af = 2
pull = none
otype = push_pull
speed = very_high

[pwm4]
type = pwm
timer = TIM3_CH2
pin = PB5
af = 2
pull = none
otype = push_pull
speed = very_high

[pwm5]
type = pwm
timer = TIM8_CH2
pin = PC7
af = 3
pull = none
otype = push_pull
speed = very_high

[pwm6]
type = pwm
timer = TIM8_CH1
pin = PC6
af = 3
pull = none
otype = push_pull
speed = very_high

[pwm7]
type = pwm
timer = TIM4_CH4
pin = PD15
af = 2
pull = none
otype = push_pull
speed = very_high

[pwm8]
type = pwm
timer = TIM4_CH3
pin = PD14
af = 2
pull = none
otype = push_pull
speed = very_high

[pwm9]
type = pwm
timer = TIM12_CH2
pin = PB15
af = 2
pull = none
otype = push_pull
speed = very_high

[pwm10]
type = pwm
timer = TIM12_CH1
pin = PB14
af = 2
pull = none
otype = push_pull
speed = very_high

[pwm11]
type = pwm
timer = TIM3_CH3
pin = PB0
af = 2
pull = none
otype = push_pull
speed = very_high

[pwm12]
type = pwm
timer = TIM3_CH4
pin = PB1
af = 2
pull = none
otype = push_pull
speed = very_high

; ===========================================================================
; 相机触发 / 输入捕获
;   TIM4_CH2, PB7 AF2（与 K9_2025V1 相同）
; ===========================================================================
[input_trigger]
timer = TIM4_CH2
pin = PB7
af = 2
pull = pull_up
otype = open_drain
speed = medium
prescale = 0
filter = 15

; ===========================================================================
; PPM 输入
;   TIM1_CH1, PA8 AF1
; ===========================================================================
[ppm]
timer = TIM1_CH1
pin = PA8
af = 1
pull = pull_up
otype = open_drain
speed = medium

; ===========================================================================
; 固定引脚配置
;   PD5: CAN1 收发器使能（低电平有效）
; ===========================================================================
[fixed_pins]
; CAN1 收发器使能脚（低电平使能）
PD5  = pushpull, 0, low, none

; ===========================================================================
; FPV ESC 配置 (LPUART1 单线半双工)
;   rx_pin  : 单线引脚 (LPUART1 RX，CR2 SWAP 后同时用作 TX)
;   rx_af   : GPIO 复用功能编号
;   rx_pull : 上拉/下拉 (pull_up / pull_down / none)
;   rx_otype: 输出类型 (open_drain / push_pull)
;   固定波特率 115200，不可通过 ini 修改
; ===========================================================================
[esc_fpv]
rx_pin   = PB7
rx_af    = 8
rx_pull  = pull_up
rx_otype = open_drain

