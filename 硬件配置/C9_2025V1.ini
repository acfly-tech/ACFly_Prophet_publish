; ACFly C9 (Prophet C9) Hardware Configuration
; Version: C9_2025V1
; Based on: ACFly Prophet C9 20250707 (固件 ACFly-C9-1.6.4-official-20210127)

[hardware]
main_version = 4    ; C9
sub_version  = 1    ; 2025V1

; ===========================================================================
; LED / 蜂鸣器配置
;   timer        : 使用的定时器 (TIMx)
;   buzzer_pin   : 蜂鸣器引脚
;   buzzer_af    : 蜂鸣器引脚复用功能号
;   buzzer_channel: 定时器通道号 (1~4)
;   buzzer_inverted : 是否低电平有效 (true=共阳/漏极开路驱动)
;   red/green/blue_pin      : 对应颜色 LED 引脚
;   red/green/blue_af       : 引脚复用功能号
;   red/green/blue_channel  : 定时器通道号
;   red/green/blue_inverted : 是否低电平有效 (true=共阳/漏极开路驱动)
;   依据: drv_LED.cpp — TIM2_APBClock, PA0(buzzer)/PA1(Blue)/PA2(Green)/PA3(Red), AF1
; ===========================================================================
[led]
timer = TIM2
buzzer_pin = PA0
buzzer_af = 1
buzzer_channel = 1
buzzer_inverted = true
blue_pin = PA1
blue_af = 1
blue_channel = 2
blue_inverted = true
green_pin = PA2
green_af = 1
green_channel = 3
green_inverted = true
red_pin = PA3
red_af = 1
red_channel = 4
red_inverted = true

[imu_bmi088]
spi = spi1
accel_cs_pin = PB11
gyro_cs_pin = PE15
axis = x, y, z
prio = 10

[imuBaro_spl06]
spi = spi1
cs_pin = PB10
prio = 10

[sbus]
uart = uart2
rx_pin = PD6
rx_af = 7
rx_pull = pull_up
rx_otype = open_drain

[uart1]
tx_pin = PA9
tx_af = 7
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA1_Stream3
rx_pin = PA10
rx_af = 7
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

[uart3]
tx_pin = PD8
tx_af = 7
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA2_Stream0
rx_pin = PD9
rx_af = 7
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

[uart5]
tx_pin = PB13
tx_af = 14
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA2_Stream1
rx_pin = PB12
rx_af = 14
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

[uart7]
tx_pin = PE8
tx_af = 7
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA2_Stream2
rx_pin = PE7
rx_af = 7
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

[uart8]
tx_pin = PE1
tx_af = 8
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
tx_dma = DMA2_Stream3
rx_pin = PE0
rx_af = 8
rx_pull = pull_up
rx_otype = open_drain
rx_speed = very_high

; ===========================================================================
; CAN 配置
;   依据: drv_Can.cpp — FDCAN1 TX=PD1 AF9, RX=PD0 AF9, Very High speed
; ===========================================================================
[can1]
tx_pin = PD1
tx_af = 9
tx_pull = none
tx_otype = push_pull
tx_speed = very_high
rx_pin = PD0
rx_af = 9
rx_pull = none
rx_otype = push_pull
rx_speed = very_high

; ===========================================================================
; I2C 配置
;   I2C1 (外部): PB8 SCL AF4, PB9 SDA AF4, High speed (0b10)
;                TX_DMA=DMA1_Stream6, RX_DMA=DMA1_Stream7
;   依据: drv_ExtIIC.cpp — I2C1, PB8/PB9 AF4, OSPEEDR=0b10 (High), 注释"中速"实际为 High
; ===========================================================================
[i2c1]
enabled = true
scl_pin = PB8
scl_af = 4
scl_pull = none
scl_otype = open_drain
scl_speed = high
sda_pin = PB9
sda_af = 4
sda_pull = none
sda_otype = open_drain
sda_speed = high
tx_dma = DMA1_Stream6
rx_dma = DMA1_Stream7

; ===========================================================================
; 内部 I2C — C9 只有一路 I2C1，内部罗盘也走 I2C1
; ===========================================================================
[i2cInt]
i2c = i2c1
ext = true

; ===========================================================================
; 内部罗盘轴向配置
;   依据: drv_InternalMag.cpp — IST8310 axis {-2,-1,3} → -y,-x,z
;                            FXOS8700 axis {-2,1,3} → -y,x,z
;                            QMC6983 axis {-1,-2,3} → -x,-y,z
; ===========================================================================
[i2c_compass_internal]
IST8310 = -y, -x, z
FXOS8700 = -y, x, z
QMC6983 = -x, -y, z

; ===========================================================================
; 外部罗盘轴向配置
;   C9 drv_ExtMag.cpp 外部罗盘，与 K9 标准列表一致
; ===========================================================================
[i2c_compass_external]
HMC5983 = -z, -x, -y
HMC5883 = -z, -x, -y
QMC5883 = -y, -x, -z
Mag3110 = -y, -x, z
IST8310 = -x, -y, -z

; ===========================================================================
; SPI 配置
;   SPI1: PA5(SCK AF5) / PA6(MISO AF5) / PA7(MOSI AF5)
;         TX_DMA=DMA1_Stream0, RX_DMA=DMA1_Stream1
;   依据: drv_Sensors.cpp — SPI1, PA5/PA6/PA7 AF5, DMA1_Stream0/1 (DMAMUX 38/37)
; ===========================================================================
[spi1]
sck_pin = PA5
sck_af = 5
miso_pin = PA6
miso_af = 5
mosi_pin = PA7
mosi_af = 5
tx_dma = DMA1_Stream0
rx_dma = DMA1_Stream1

; ===========================================================================
; ADC 配置
;   ADC3, 16 bit, 过采样 1024
;   依据: drv_ADC.cpp — SQR序列: [0]=VREFINT(19), [1]=PC0(ch10)=电流,
;                       [2]=PC1(ch11)=电压, [3]=PC2(ch0)=舵机电压,
;                       [4]=PC3(ch1)=电流, [5]=TEMP(18)
;                       DMA1_Stream5 (DMAMUX #115)
;   注意: C9 代码 Bat_CurrentMKp 对应 PC0(ch10), Bat_VoltMKp 对应 PC1(ch11)
; ===========================================================================
[adc]
resolution = 16
oversampling = 1024
bat1_volt = adc3_ch11
bat1_volt_pin = PC1
bat1_volt_sample_time = 7
bat1_current = adc3_ch10
bat1_current_pin = PC0
bat1_current_sample_time = 7

; ===========================================================================
; PWM 通道配置 (共 12 路)
;   对应 C9 drv_PWMOut.cpp 通道顺序:
;   pwm1  : TIM15_CH2 → PE6 AF4
;   pwm2  : TIM15_CH1 → PE5 AF4
;   pwm3  : TIM3_CH2  → PB5 AF2
;   pwm4  : TIM3_CH1  → PB4 AF2  (注意 C9 注释里 PB3 仅用于蓝灯)
;   pwm5  : TIM8_CH2  → PC7 AF3
;   pwm6  : TIM8_CH1  → PC6 AF3
;   pwm7  : TIM4_CH4  → PD15 AF2
;   pwm8  : TIM4_CH3  → PD14 AF2
;   pwm9  : TIM12_CH1 → PB14 AF2
;   pwm10 : TIM12_CH2 → PB15 AF2
;   pwm11 : TIM3_CH3  → PB0 AF2
;   pwm12 : TIM3_CH4  → PB1 AF2
;
;   引脚速度: C9 drv_PWMOut.cpp 显式设 OSPEEDR=0b01 (Medium)
; ===========================================================================
[pwm1]
type = pwm
timer = TIM15_CH2
pin = PE6
af = 4
pull = none
otype = push_pull
speed = medium

[pwm2]
type = pwm
timer = TIM15_CH1
pin = PE5
af = 4
pull = none
otype = push_pull
speed = medium

[pwm3]
type = pwm
timer = TIM3_CH2
pin = PB5
af = 2
pull = none
otype = push_pull
speed = medium

[pwm4]
type = pwm
timer = TIM3_CH1
pin = PB4
af = 2
pull = none
otype = push_pull
speed = medium

[pwm5]
type = pwm
timer = TIM8_CH2
pin = PC7
af = 3
pull = none
otype = push_pull
speed = medium

[pwm6]
type = pwm
timer = TIM8_CH1
pin = PC6
af = 3
pull = none
otype = push_pull
speed = medium

[pwm7]
type = pwm
timer = TIM4_CH4
pin = PD15
af = 2
pull = none
otype = push_pull
speed = medium

[pwm8]
type = pwm
timer = TIM4_CH3
pin = PD14
af = 2
pull = none
otype = push_pull
speed = medium

[pwm9]
type = pwm
timer = TIM12_CH1
pin = PB14
af = 2
pull = none
otype = push_pull
speed = medium

[pwm10]
type = pwm
timer = TIM12_CH2
pin = PB15
af = 2
pull = none
otype = push_pull
speed = medium

[pwm11]
type = pwm
timer = TIM3_CH3
pin = PB0
af = 2
pull = none
otype = push_pull
speed = medium

[pwm12]
type = pwm
timer = TIM3_CH4
pin = PB1
af = 2
pull = none
otype = push_pull
speed = medium

; ===========================================================================
; 相机触发 / 输入捕获
;   TIM4_CH2, PB7 AF2, 开漏上拉
;   依据: drv_PWMOut.cpp — TIM4_CH2 PB7, OTYPER=open_drain, PUPDR=pull_up, Medium
; ===========================================================================
[input_trigger]
timer = TIM4_CH2
pin = PB7
af = 2
pull = pull_up
otype = open_drain
speed = medium
prescale = 0
filter = 15

; ===========================================================================
; PPM 输入
;   TIM1_CH1, PA8 AF1
;   依据: drv_RCPPM.cpp — TIM1_CH1 PA8 AF1, 开漏上拉
; ===========================================================================
[ppm]
timer = TIM1_CH1
pin = PA8
af = 1
pull = pull_up
otype = open_drain
speed = medium

; ====================== 固定引脚配置 ======================
; 格式：引脚名称 = 模式, 输出电平, 速度, 上拉/下拉
; 模式可选： pushpull, opendrain
; 输出电平： 0=拉低, 1=拉高
; 速度： low, medium, high, very_high
; 上拉/下拉： none, up, down
;   依据: drv_Can.cpp — CANVER=1 时 FDCAN 收发器使能脚 PD5, Medium,
;         初始化时拉低 (enable=0)，运行中拉高使能
[fixed_pins]
; CAN1 收发器使能脚 (PD5, 低电平有效)
PD5  = pushpull, 0, low, none

